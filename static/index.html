<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket Recordings</title>
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e3e2dd;
  --accent: #2f6fdb; --accent-ink: #fff; --sel: #e8effc; --warn: #b4401f; --ok: #2e7d4f;
  --wave: #c5cbd6; --wave-played: #2f6fdb; --chip: #eeede8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #9a9993; --line: #33332f;
    --accent: #6c9bf0; --accent-ink: #0d0d0c; --sel: #24314a; --warn: #f08a6a; --ok: #6fcf97;
    --wave: #45484f; --wave-played: #6c9bf0; --chip: #2b2b28;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
button, select, input { font: inherit; color: inherit; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 5px 11px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--muted); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.danger { color: var(--warn); }
button.link { border: 0; background: none; padding: 0 4px; color: var(--accent); }
input[type=text], input[type=search], select { background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 8px; }
header { display: flex; gap: 10px; align-items: center; padding: 10px 16px;
  border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
header .grow { flex: 1; }
#search { width: 240px; }
#modelSel { max-width: 190px; }
.layout { display: grid; grid-template-columns: minmax(340px, 42%) 1fr; height: calc(100vh - 51px); }
.listpane { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.actions { display: flex; gap: 6px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line);
  flex-wrap: wrap; background: var(--panel); }
.actions .count { color: var(--muted); margin-right: auto; }
#list { overflow: auto; flex: 1; }
.row { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; padding: 8px 12px;
  border-bottom: 1px solid var(--line); cursor: pointer; align-items: start; }
.row > div { min-width: 0; }
.row:hover { background: color-mix(in srgb, var(--sel) 50%, transparent); }
.row.active { background: var(--sel); }
.row .t { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .t.untitled { font-weight: 400; color: var(--muted); }
.row .sub { color: var(--muted); font-size: 12.5px; }
.row .right { text-align: right; font-size: 12px; color: var(--muted); white-space: nowrap; }
.badges { display: inline-flex; gap: 3px; margin-top: 3px; }
.b { font-size: 11px; padding: 0 6px; border-radius: 9px; background: var(--chip); color: var(--muted); }
.b.on { color: var(--ok); }
.b.dev { color: var(--accent); }
.b.queued { color: var(--warn); }
.daysep { padding: 6px 12px 3px; font-size: 12px; color: var(--muted); font-weight: 600;
  background: var(--bg); border-bottom: 1px solid var(--line); position: sticky; top: 0; }
.detail { overflow: auto; padding: 0 24px 120px; min-height: 0; }
.dhead { position: sticky; top: 0; z-index: 3; background: var(--bg); padding-top: 18px; }
.empty { color: var(--muted); padding: 40px; text-align: center; }
#titleInput { font-size: 19px; font-weight: 600; width: 100%; border: 1px solid transparent;
  background: transparent; padding: 4px 6px; margin-left: -6px; border-radius: 6px; }
#titleInput:hover, #titleInput:focus { border-color: var(--line); background: var(--panel); outline: none; }
.metaline { color: var(--muted); margin: 2px 0 12px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.player { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.player .ctl { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.player .time { font-variant-numeric: tabular-nums; color: var(--muted); }
canvas#wave { width: 100%; height: 64px; display: block; cursor: pointer; }
.tabs { display: flex; gap: 4px; margin: 16px 0 8px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 6px 10px; }
.tabs button.active { border-bottom-color: var(--accent); font-weight: 600; }
.seg { display: grid; grid-template-columns: 58px 1fr; gap: 8px; padding: 3px 6px; border-radius: 6px; cursor: pointer; }
.seg:hover { background: color-mix(in srgb, var(--sel) 60%, transparent); }
.seg.now { background: var(--sel); }
.seg .ts { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12.5px; padding-top: 1px; }
.seg .who { font-weight: 600; margin-right: 4px; }
.seg.mv-on { grid-template-columns: 58px 1fr 26px; }
.seg .mvb { opacity: .35; padding: 0 5px; font-size: 12px; line-height: 18px; align-self: start; }
.seg:hover .mvb, .seg.picked .mvb { opacity: 1; }
.seg.mv-on .who { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
.seg.mv-on .who:hover { color: var(--accent); }
.seg.picked { outline: 2px solid var(--accent); outline-offset: -2px; }
.seg .who.moved::after { content: " ✎"; font-weight: 400; color: var(--muted); }
#mvMenu { position: fixed; z-index: 20; width: 250px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; box-shadow: 0 10px 30px rgb(0 0 0 / .18); padding: 8px; display: none; }
#mvMenu.open { display: block; }
#mvMenu .t { font-weight: 600; margin: 2px 4px 6px; }
#mvMenu .opt { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 4px 6px; border-radius: 6px; }
#mvMenu .opt:hover { background: var(--sel); }
#mvMenu .opt .note { margin-left: 4px; }
#mvMenu .sep { border-top: 1px solid var(--line); margin: 6px 0; }
#mvMenu label { display: flex; gap: 6px; align-items: center; font-size: 12.5px; margin: 2px 4px 6px; color: var(--muted); }
#mvMenu .other { display: flex; gap: 6px; }
#mvMenu .other input { flex: 1; min-width: 0; }
.summary h1, .summary h2, .summary h3 { font-size: 15px; margin: 14px 0 4px; }
.summary ul { padding-left: 20px; margin: 4px 0; }
.spk { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; background: var(--panel); }
.spk .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spk .head .lab { font-weight: 600; min-width: 80px; }
.spk .clip { display: grid; grid-template-columns: 26px 54px 1fr; gap: 6px; align-items: start; margin-top: 6px; color: var(--muted); }
.spk .clip button { padding: 0 6px; }
.note { color: var(--muted); font-size: 12.5px; }
.cta { display: flex; gap: 8px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
#queue { position: fixed; right: 16px; bottom: 16px; width: 440px; max-height: 60vh; display: none;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgb(0 0 0 / .18);
  flex-direction: column; z-index: 10; }
#queue.open { display: flex; }
#queue .qh { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
#queue .qh b { flex: 1; }
#queue .ql { overflow: auto; padding: 4px 0; }
.job { padding: 8px 12px; border-bottom: 1px solid var(--line); }
.job .jt { display: flex; gap: 6px; align-items: center; }
.job .jt .k { font-weight: 600; }
.job .jt .r { color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job .p { color: var(--muted); font-size: 12.5px; margin-top: 2px; overflow-wrap: anywhere; }
.job.running { background: color-mix(in srgb, var(--sel) 55%, transparent); }
.job .st { font-size: 11px; padding: 0 6px; border-radius: 9px; background: var(--chip); }
.st.failed { color: var(--warn); } .st.done { color: var(--ok); } .st.running { color: var(--accent); }
#banner { display: none; padding: 10px 16px; background: var(--sel); border-bottom: 1px solid var(--line); font-weight: 550; }
#banner.show { display: block; }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); padding: 18px 20px; max-width: 460px; }
dialog::backdrop { background: rgb(0 0 0 / .35); }
dialog h3 { margin: 0 0 10px; font-size: 16px; }
dialog label { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0; }
dialog .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
#toast.show { opacity: .92; }
@media (max-width: 800px) {
  .layout { grid-template-columns: 1fr; height: auto; }
  .listpane { max-height: 45vh; border-right: 0; border-bottom: 1px solid var(--line); }
  header { flex-wrap: wrap; position: static; } #devUpdated { display: none; }
  #search { width: 100%; order: 5; } #queue { left: 16px; width: auto; }
  .detail { padding: 0 16px 120px; }
}
</style>
</head>
<body>
<header>
  <h1>Pocket Recordings</h1>
  <input id="search" type="search" placeholder="Search titles, speakers, transcripts">
  <label class="note"><input type="checkbox" id="showShort"> short clips</label>
  <span class="grow"></span>
  <span class="note" id="devUpdated"></span>
  <select id="syncHow" title="How to sync"><option value="sync_ble">Bluetooth</option><option value="sync_usb">USB cable</option></select>
  <button id="syncBtn" class="primary">Sync</button>
  <button id="queueBtn">Queue</button>
  <button id="quitBtn" title="Stop the Pocket Recordings server">Quit</button>
</header>
<div id="banner"></div>
<div class="layout">
  <section class="listpane">
    <div class="actions">
      <label><input type="checkbox" id="selAll"></label>
      <span class="count" id="selCount">0 selected</span>
      <button id="actTranscribe" disabled>Transcribe</button>
      <select id="modelSel" title="Summary model"></select>
      <button id="actSummarize" disabled>Summarize</button>
      <button id="actDelete" class="danger" disabled>Delete…</button>
    </div>
    <div id="list"></div>
  </section>
  <section class="detail" id="detail"><div class="empty">Select a recording.</div></section>
</div>

<div id="queue">
  <div class="qh"><b>Queue</b><span class="note" id="qEta"></span>
    <button class="link" id="qClear">Clear finished</button><button class="link" id="qClose">Close</button></div>
  <div class="ql" id="qList"></div>
</div>

<dialog id="delDlg">
  <h3 id="delTitle">Delete</h3>
  <label><input type="checkbox" id="delAudio"> <span><b>Audio file only</b> (keep transcript and summary)<br>
    <span class="note" id="delAudioNote">Audio moves to the Trash. The title, transcript, summary and speakers stay; playback and re-transcribing won't be possible.</span></span></label>
  <label><input type="checkbox" id="delMac"> <span><b>Mac copy and transcripts</b><br>
    <span class="note">Everything for the recording moves to the Trash. Sync won't download it again.</span></span></label>
  <label><input type="checkbox" id="delDev"> <span><b>On the recorder</b><br>
    <span class="note" id="delDevNote">Deleted over Bluetooth by a queued job. This can't be undone.</span></span></label>
  <div class="btns"><button id="delCancel">Cancel</button><button id="delGo" class="primary" disabled>Delete</button></div>
</dialog>
<div id="toast"></div>
<div id="mvMenu"></div>

<script>
const $ = s => document.querySelector(s);
const state = { recs: [], selected: new Set(), active: null, detail: null, jobs: [], peaks: null, tab: 'transcript', voices: [] };
const audio = new Audio();
audio.preload = 'metadata';

function fmt(sec) {
  if (sec == null || isNaN(sec)) return '–';
  sec = Math.round(sec); const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
}
function whenOf(r) {  // names are UTC start times; show local time
  const m = /^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})$/.exec(r.name);
  if (!m) return { day: r.date, time: r.name };
  const d = new Date(Date.UTC(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]));
  return { day: d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }),
           time: d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }) };
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3500); }
async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || r.statusText);
  return data;
}

// ── list ────────────────────────────────────────────
async function loadList() {
  const q = encodeURIComponent($('#search').value.trim());
  const data = await api(`/api/recordings?q=${q}&short=${$('#showShort').checked}`);
  state.recs = data.recordings;
  $('#devUpdated').textContent = data.device_updated ? `Recorder checked ${new Date(data.device_updated).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}` : '';
  for (const id of [...state.selected]) if (!state.recs.some(r => r.id === id)) state.selected.delete(id);
  renderList();
}
function queuedKinds(id) {
  return state.jobs.filter(j => j.recs.includes(id) && (j.status === 'pending' || j.status === 'running')).map(j => j.kind);
}
function renderList() {
  const el = $('#list'); let html = '', lastDay = '';
  if (!state.recs.length) html = '<div class="empty">No recordings. Click Sync to fetch them from the recorder.</div>';
  for (const r of state.recs) {
    const w = whenOf(r);
    if (w.day !== lastDay) { html += `<div class="daysep">${esc(w.day)}</div>`; lastDay = w.day; }
    const q = queuedKinds(r.id);
    const badges = [
      r.transcribed ? '<span class="b on">transcript</span>' : '',
      r.summarized ? '<span class="b on">summary</span>' : '',
      r.on_device ? `<span class="b dev">${r.on_mac ? 'on recorder' : 'only on recorder'}</span>` : '',
      r.deleted_locally ? '<span class="b">deleted on Mac</span>' : '',
      r.on_mac && r.has_audio === false ? '<span class="b">audio deleted</span>' : '',
      ...q.map(k => `<span class="b queued">${k === 'delete_device' ? 'deleting' : k + ' queued'}</span>`),
    ].join('');
    html += `<div class="row ${state.active === r.id ? 'active' : ''}" data-id="${esc(r.id)}">
      <input type="checkbox" ${state.selected.has(r.id) ? 'checked' : ''} data-sel="${esc(r.id)}" ${r.on_mac ? '' : 'disabled'}>
      <div><div class="t ${r.title ? '' : 'untitled'}">${esc(r.title || w.time)}</div>
        <div class="sub">${r.title ? esc(w.time) + ' · ' : ''}${esc(r.speakers.join(', ') || (r.transcribed ? '' : ''))}</div>
        <div class="badges">${badges}</div></div>
      <div class="right">${fmt(r.seconds)}</div></div>`;
  }
  el.innerHTML = html;
  updateActions();
}
$('#list').addEventListener('click', e => {
  const cb = e.target.closest('[data-sel]');
  if (cb) { cb.checked ? state.selected.add(cb.dataset.sel) : state.selected.delete(cb.dataset.sel); updateActions(); return; }
  const row = e.target.closest('.row'); if (row) openRec(row.dataset.id);
});
function updateActions() {
  const n = state.selected.size;
  $('#selCount').textContent = `${n} selected`;
  for (const b of ['#actTranscribe', '#actSummarize', '#actDelete']) $(b).disabled = n === 0;
  const selectable = state.recs.filter(r => r.on_mac);
  $('#selAll').checked = n > 0 && n === selectable.length;
}
$('#selAll').addEventListener('change', e => {
  state.selected = new Set(e.target.checked ? state.recs.filter(r => r.on_mac).map(r => r.id) : []);
  renderList();
});
let searchT; $('#search').addEventListener('input', () => { clearTimeout(searchT); searchT = setTimeout(loadList, 250); });
$('#showShort').addEventListener('change', loadList);

// ── actions ─────────────────────────────────────────
async function enqueue(kind, ids, options) {
  try {
    const r = await api('/api/jobs', { method: 'POST', body: { kind, ids, options } });
    toast(r.jobs.length ? `Queued ${r.jobs.length} ${kind} job${r.jobs.length > 1 ? 's' : ''}` : 'Already queued');
    await loadJobs(); renderList(); if (r.jobs.length) openQueue();
  } catch (e) { toast(e.message); }
}
$('#actTranscribe').onclick = () => enqueue('transcribe', [...state.selected]);
$('#actSummarize').onclick = () => enqueue('summarize', [...state.selected], { model: $('#modelSel').value });
$('#syncBtn').onclick = () => enqueue($('#syncHow').value, []);
$('#modelSel').onchange = () => api('/api/settings', { method: 'PUT', body: { summary_model: $('#modelSel').value } });

async function loadModels() {
  try {
    const d = await api('/api/models');
    $('#modelSel').innerHTML = d.models.map(m => `<option value="${esc(m.id)}" ${m.id === d.default ? 'selected' : ''}>${esc(m.id)}${m.state === 'loaded' ? ' (loaded)' : ''}</option>`).join('')
      || '<option value="">LM Studio not running</option>';
  } catch { $('#modelSel').innerHTML = '<option value="">LM Studio not running</option>'; }
}

// delete dialog
let delIds = [];
function openDelete(ids) {
  delIds = ids;
  const recs = state.recs.filter(r => ids.includes(r.id));
  const anyDev = recs.some(r => r.on_device), anyMac = recs.some(r => r.on_mac);
  const audioOk = recs.filter(r => r.has_audio && r.transcribed).length;
  $('#delTitle').textContent = ids.length === 1 ? `Delete “${recs[0]?.title || whenOf(recs[0]).time}”?` : `Delete ${ids.length} recordings?`;
  $('#delMac').checked = false; $('#delDev').checked = false; $('#delAudio').checked = false;
  $('#delMac').disabled = !anyMac; $('#delDev').disabled = !anyDev; $('#delAudio').disabled = !audioOk;
  $('#delAudioNote').textContent = !audioOk
    ? (recs.some(r => r.has_audio) ? 'Only for recordings that have a transcript.' : 'The audio file is already deleted.')
    : 'Audio moves to the Trash. The title, transcript, summary and speakers stay; playback and re-transcribing won’t be possible.'
      + (audioOk < recs.length ? ` Applies to ${audioOk} of ${recs.length} (the others have no transcript or no audio).` : '');
  $('#delDevNote').textContent = anyDev ? 'Deleted over Bluetooth by a queued job. This can’t be undone.'
    : 'Not on the recorder as of the last sync.';
  $('#delGo').disabled = true; $('#delDlg').showModal();
}
for (const id of ['#delMac', '#delDev', '#delAudio']) $(id).onchange = e => {
  // "Audio only" and "Mac copy and transcripts" are alternatives.
  if (e.target.id === 'delMac' && e.target.checked) $('#delAudio').checked = false;
  if (e.target.id === 'delAudio' && e.target.checked) $('#delMac').checked = false;
  $('#delGo').disabled = !($('#delMac').checked || $('#delDev').checked || $('#delAudio').checked);
};
$('#delCancel').onclick = () => $('#delDlg').close();
$('#delGo').onclick = async () => {
  const body = { ids: delIds, mac: $('#delMac').checked, device: $('#delDev').checked, audio_only: $('#delAudio').checked };
  $('#delDlg').close();
  try {
    const r = await api('/api/delete', { method: 'POST', body });
    toast([r.trashed ? `${r.trashed} moved to the Trash` : '',
           r.audio_removed ? `audio of ${r.audio_removed} moved to the Trash` : '',
           r.skipped?.length ? `${r.skipped.length} skipped (no transcript)` : '',
           r.job ? 'recorder deletion queued' : ''].filter(Boolean).join('; ') || 'Nothing deleted');
    if ((body.mac || body.audio_only) && delIds.includes(state.active)) { audio.pause(); audio.removeAttribute('src'); audio.dataset.id = ''; }
    if (body.mac && delIds.includes(state.active)) { state.active = null; $('#detail').innerHTML = '<div class="empty">Select a recording.</div>'; }
    else if (body.audio_only && delIds.includes(state.active)) openRec(state.active);
    for (const id of delIds) state.selected.delete(id);
    await loadJobs(); await loadList();
  } catch (e) { toast(e.message); }
};
$('#actDelete').onclick = () => openDelete([...state.selected]);

// ── detail ──────────────────────────────────────────
async function openRec(id) {
  const r = state.recs.find(x => x.id === id);
  state.active = id; renderList();
  if (r && !r.on_mac) {
    audio.pause();
    $('#detail').innerHTML = `<div class="empty">This recording is only on the recorder. Sync to download it.</div>`;
    return;
  }
  const d = await api(`/api/recordings/${id}`);
  state.detail = d; state.peaks = null;
  if (!d.has_audio) {  // transcript-only: the audio file was deleted to save space
    audio.pause(); audio.removeAttribute('src'); audio.dataset.id = '';
    renderDetail(); return;
  }
  const keepTime = audio.dataset.id === id ? audio.currentTime : 0;
  if (audio.dataset.id !== id) { audio.pause(); audio.src = `/audio/${id}.mp3`; audio.dataset.id = id; }
  renderDetail();
  if (keepTime) audio.currentTime = keepTime;
  api(`/api/recordings/${id}/peaks`).then(p => { if (state.active === id) { state.peaks = p.peaks; drawWave(); } });
}
function renderDetail() {
  const d = state.detail, w = whenOf(d), q = queuedKinds(d.id);
  $('#detail').innerHTML = `<div class="dhead">
    <input id="titleInput" type="text" value="${esc(d.title || '')}" placeholder="${esc(w.day + ', ' + w.time)} — add a title">
    <div class="metaline"><span>${esc(w.day)}, ${esc(w.time)}</span><span>${fmt(d.seconds)}</span>
      ${d.title_source === 'llm' ? '<span class="note">title suggested by the LLM</span>' : ''}
      ${d.on_device ? '<span class="b dev">on recorder</span>' : ''}
      ${q.map(k => `<span class="b queued">${k} queued</span>`).join('')}
      <span class="grow"></span><button class="danger" id="delOne">Delete…</button></div>
    ${d.has_audio ? `<div class="player"><canvas id="wave"></canvas>
      <div class="ctl"><button id="playBtn" class="primary">Play</button><button id="back10">−10s</button><button id="fwd10">+10s</button>
        <select id="rate"><option value="1">1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
        <span class="time" id="timeLbl">0:00 / ${fmt(d.seconds)}</span></div></div>`
      : `<div class="player note">The audio file was deleted to save space; the transcript, summary and speakers are kept.${d.on_device ? ' It is still on the recorder: Sync will not download it again, but you can find it there.' : ''}</div>`}
    <div class="tabs">
      <button data-tab="transcript">Transcript</button><button data-tab="summary">Summary</button>
      <button data-tab="speakers">Speakers${d.speaker_details.length ? ' (' + d.speaker_details.length + ')' : ''}</button></div></div>
    <div id="tabBody"></div>`;
  $('#titleInput').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
  $('#titleInput').addEventListener('change', async e => {
    try { await api(`/api/recordings/${d.id}/title`, { method: 'PUT', body: { title: e.target.value } });
      d.title = e.target.value.trim() || null; d.title_source = d.title ? 'user' : null; toast('Title saved'); loadList(); }
    catch (err) { toast(err.message); }
  });
  $('#delOne').onclick = () => openDelete([d.id]);
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { state.tab = b.dataset.tab; renderTab(); });
  if (d.has_audio) {
    $('#playBtn').onclick = () => audio.paused ? audio.play() : audio.pause();
    $('#back10').onclick = () => audio.currentTime = Math.max(0, audio.currentTime - 10);
    $('#fwd10').onclick = () => audio.currentTime = audio.currentTime + 10;
    $('#rate').value = String(audio.playbackRate); $('#rate').onchange = e => audio.playbackRate = +e.target.value;
    $('#wave').onclick = e => { const r = e.target.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * (audio.duration || d.seconds)); };
  }
  renderTab(); drawWave(); syncPlayer();
}
function seek(t, stopAt) {
  if (!state.detail?.has_audio) return;
  audio.currentTime = t; audio.dataset.stopAt = stopAt ?? ''; audio.play();
}
function renderTab() {
  const d = state.detail, body = $('#tabBody');
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === state.tab));
  if (state.tab === 'transcript') {
    if (!d.segments.length && !d.has_audio) { body.innerHTML = '<div class="note">No transcript, and the audio file was deleted.</div>'; return; }
    if (!d.segments.length) { body.innerHTML = `<div class="cta"><span class="note">No transcript yet.</span><button id="ctaT">Transcribe</button></div>`;
      $('#ctaT').onclick = () => enqueue('transcribe', [d.id]); return; }
    let prev = null;
    const canMove = d.speakers_done;
    body.innerHTML = d.segments.map((s, i) => {
      const who = s.speaker && (s.speaker !== prev || s.moved !== d.segments[i - 1]?.moved)
        ? `<span class="who${s.moved ? ' moved' : ''}"${canMove ? ` data-mvwho="${i}"` : ''} title="${s.moved ? 'Moved by you. ' : ''}${canMove ? 'Click to move to another speaker' : ''}">${esc(s.speaker)}:</span>` : '';
      prev = s.speaker;
      return `<div class="seg${canMove ? ' mv-on' : ''}" data-i="${i}"><span class="ts">${fmt(s.start)}</span><span>${who}${esc(s.text)}</span>`
        + (canMove ? `<button class="mvb" data-mv="${i}" title="Move this line to another speaker">⇄</button>` : '') + '</div>';
    }).join('');
    body.onclick = e => {
      const m = e.target.closest('[data-mv]');
      if (m) { e.stopPropagation(); openMove(+m.dataset.mv, m); return; }
      const w = e.target.closest('[data-mvwho]');
      if (w) { e.stopPropagation(); openMove(+w.dataset.mvwho, w); return; }
      const s = e.target.closest('.seg'); if (s) seek(d.segments[+s.dataset.i].start);
    };
  } else if (state.tab === 'summary') {
    body.innerHTML = d.summary ? `<div class="summary">${md(d.summary)}</div><div class="cta"><button id="ctaS">Summarize again</button></div>`
      : `<div class="cta"><span class="note">No summary yet.</span><button id="ctaS">Summarize</button></div>`;
    $('#ctaS').onclick = () => enqueue('summarize', [d.id], { model: $('#modelSel').value });
  } else {
    if (!d.speaker_details.length) { body.innerHTML = `<div class="note">Speakers are identified when the recording is transcribed.</div>`; return; }
    body.innerHTML = `<p class="note">Play a few clips to tell who's who, then name them. Named voices are recognized in other recordings automatically.</p>
      <datalist id="voiceList">${state.voices.map(v => `<option value="${esc(v.name)}">`).join('')}</datalist>` +
      d.speaker_details.map((s, i) => `<div class="spk"><div class="head">
        <span class="lab">${esc(s.name || s.label)}</span>
        <span class="note">${(s.seconds / 60).toFixed(1)} min${s.name ? (s.pinned ? ' · named by you' : ` · recognized (${s.score?.toFixed(2)})`) : ''}</span>
        <span class="grow" style="flex:1"></span>
        <input type="text" list="voiceList" placeholder="Name" value="${esc(s.name || '')}" data-name="${i}" style="width:150px">
        <button data-save="${i}">Save</button></div>
        ${s.clips.map(c => `<div class="clip">${d.has_audio ? `<button data-clip="${c.start},${c.end}" title="Play clip">▶</button>` : '<span></span>'}<span>${fmt(c.start)}</span><span>${esc(c.text)}</span></div>`).join('')}
      </div>`).join('');
    body.onclick = async e => {
      const c = e.target.closest('[data-clip]');
      if (c) { const [a, b] = c.dataset.clip.split(',').map(Number); seek(a, b); return; }
      const sv = e.target.closest('[data-save]');
      if (sv) {
        const s = d.speaker_details[+sv.dataset.save], name = body.querySelector(`[data-name="${sv.dataset.save}"]`).value.trim();
        if (!name) return toast('Type a name first');
        sv.disabled = true; sv.textContent = 'Saving…';
        try { await api(`/api/recordings/${d.id}/speakers`, { method: 'POST', body: { label: s.label, name } });
          toast(`Saved ${name}; other recordings relabelled`); await loadVoices(); await openRec(d.id); state.tab = 'speakers'; renderTab(); loadList(); }
        catch (err) { toast(err.message); sv.disabled = false; sv.textContent = 'Save'; }
      }
    };
  }
}
// ── move lines to another speaker ───────────────────
function turnOf(i) {  // the run of consecutive lines with the same speaker around line i
  const segs = state.detail.segments, lab = segs[i].label;
  let a = i, b = i;
  while (a > 0 && segs[a - 1].label === lab) a--;
  while (b < segs.length - 1 && segs[b + 1].label === lab) b++;
  return [a, b];
}
function closeMove() {
  $('#mvMenu').classList.remove('open');
  document.querySelectorAll('.seg.picked').forEach(e => e.classList.remove('picked'));
}
function openMove(i, btn) {
  const d = state.detail, seg = d.segments[i], [a, b] = turnOf(i), menu = $('#mvMenu');
  const here = d.speaker_details.map(s => s.name || s.label);
  const names = [...new Set([...here, ...state.voices.map(v => v.name)])].filter(n => n !== seg.speaker);
  menu.innerHTML = `<div class="t">Move to…</div>
    ${b > a ? `<label><input type="checkbox" id="mvTurn"> Whole turn: ${b - a + 1} lines, ${fmt(d.segments[a].start)}–${fmt(d.segments[b].end)}</label>` : ''}
    ${names.map(n => `<button class="opt" data-to="${esc(n)}">${esc(n)}${here.includes(n) ? '' : '<span class="note">not in this recording yet</span>'}</button>`).join('')}
    <div class="sep"></div>
    <div class="other"><input type="text" id="mvOther" placeholder="Someone else…"><button id="mvGo">Move</button></div>`;
  const mark = () => {
    const [x, y] = $('#mvTurn')?.checked ? [a, b] : [i, i];
    document.querySelectorAll('.seg.picked').forEach(e => e.classList.remove('picked'));
    for (let k = x; k <= y; k++) document.querySelector(`.seg[data-i="${k}"]`)?.classList.add('picked');
  };
  mark();
  if ($('#mvTurn')) $('#mvTurn').onchange = mark;
  const go = async to => {
    to = to.trim(); if (!to) return toast('Type a name first');
    const lines = $('#mvTurn')?.checked ? `${a}-${b}` : `${i}`;
    menu.querySelectorAll('button').forEach(x => x.disabled = true);
    try {
      await api(`/api/recordings/${d.id}/move`, { method: 'POST', body: { lines, name: to } });
      closeMove();
      const sc = $('#detail').scrollTop, fresh = await api(`/api/recordings/${d.id}`);
      if (state.active !== d.id) return;
      state.detail = fresh; renderDetail(); $('#detail').scrollTop = sc;
      toast(`Moved to ${to}`); loadList();
    } catch (err) { toast(err.message); menu.querySelectorAll('button').forEach(x => x.disabled = false); }
  };
  menu.onclick = e => { const o = e.target.closest('[data-to]'); if (o) go(o.dataset.to); };
  $('#mvGo').onclick = () => go($('#mvOther').value);
  $('#mvOther').onkeydown = e => { if (e.key === 'Enter') go(e.target.value); if (e.key === 'Escape') closeMove(); };
  const r = btn.getBoundingClientRect();
  menu.classList.add('open');
  const h = menu.offsetHeight;
  const x = btn.matches('[data-mvwho]') ? r.left : r.right - menu.offsetWidth;
  menu.style.left = Math.max(8, Math.min(x, innerWidth - menu.offsetWidth - 8)) + 'px';
  menu.style.top = (r.bottom + 4 + h > innerHeight ? Math.max(8, r.top - h - 4) : r.bottom + 4) + 'px';
}
document.addEventListener('mousedown', e => { if (!e.target.closest('#mvMenu, [data-mv], [data-mvwho]')) closeMove(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMove(); });

function md(text) {  // small Markdown subset: headings, bold, italics, bullets
  const lines = text.split('\n'); let html = '', inList = false;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|\W)_(.+?)_(\W|$)/g, '$1<i>$2</i>$3').replace(/\*(.+?)\*/g, '<i>$1</i>');
  for (const l of lines) {
    const li = /^\s*[-*]\s+(.*)/.exec(l), h = /^(#{1,4})\s+(.*)/.exec(l);
    if (li) { if (!inList) { html += '<ul>'; inList = true; } html += `<li>${inline(li[1])}</li>`; continue; }
    if (inList) { html += '</ul>'; inList = false; }
    if (h) html += `<h3>${inline(h[2])}</h3>`; else if (l.trim()) html += `<p>${inline(l)}</p>`;
  }
  return html + (inList ? '</ul>' : '');
}

// ── player ──────────────────────────────────────────
function drawWave() {
  const c = $('#wave'); if (!c) return;
  const dpr = devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  c.width = w * dpr; c.height = h * dpr;
  const g = c.getContext('2d'); g.scale(dpr, dpr); g.clearRect(0, 0, w, h);
  const cs = getComputedStyle(document.documentElement);
  const peaks = state.peaks, dur = audio.duration || state.detail?.seconds || 1;
  const played = audio.currentTime / dur;
  if (!peaks) { g.fillStyle = cs.getPropertyValue('--wave'); g.fillRect(0, h / 2 - 1, w, 2); return; }
  const bars = Math.floor(w / 3);
  for (let i = 0; i < bars; i++) {
    const a = Math.floor(i / bars * peaks.length), b = Math.max(a + 1, Math.floor((i + 1) / bars * peaks.length));
    let v = 0; for (let k = a; k < b; k++) v = Math.max(v, peaks[k]);
    const bh = Math.max(2, v * (h - 4));
    g.fillStyle = cs.getPropertyValue(i / bars < played ? '--wave-played' : '--wave');
    g.fillRect(i * 3, (h - bh) / 2, 2, bh);
  }
}
function syncPlayer() {
  const btn = $('#playBtn'); if (btn) btn.textContent = audio.paused ? 'Play' : 'Pause';
  const lbl = $('#timeLbl'); if (lbl) lbl.textContent = `${fmt(audio.currentTime)} / ${fmt(audio.duration || state.detail?.seconds)}`;
}
let lastSeg = -1;
audio.addEventListener('timeupdate', () => {
  if (audio.dataset.stopAt && audio.currentTime >= +audio.dataset.stopAt) { audio.pause(); audio.dataset.stopAt = ''; }
  syncPlayer(); drawWave();
  const d = state.detail; if (!d || state.tab !== 'transcript' || audio.dataset.id !== d.id) return;
  const t = audio.currentTime, i = d.segments.findIndex(s => t >= s.start && t < s.end + 0.3);
  if (i !== lastSeg) {
    document.querySelectorAll('.seg.now').forEach(e => e.classList.remove('now'));
    const el = document.querySelector(`.seg[data-i="${i}"]`);
    if (el) { el.classList.add('now'); if (!audio.paused) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
    lastSeg = i;
  }
});
for (const ev of ['play', 'pause', 'loadedmetadata', 'ended']) audio.addEventListener(ev, syncPlayer);
addEventListener('resize', drawWave);
document.addEventListener('keydown', e => {
  if (e.target.matches('input, select, textarea') || !state.detail) return;
  if (e.code === 'Space') { e.preventDefault(); audio.paused ? audio.play() : audio.pause(); }
});

// ── queue ───────────────────────────────────────────
const KIND = { transcribe: 'Transcribe', summarize: 'Summarize', sync_ble: 'Sync (Bluetooth)', sync_usb: 'Sync (USB)', delete_device: 'Delete from recorder' };
function openQueue() { $('#queue').classList.add('open'); }
$('#queueBtn').onclick = () => $('#queue').classList.toggle('open');
$('#qClose').onclick = () => $('#queue').classList.remove('open');
$('#qClear').onclick = async () => { await api('/api/jobs/clear', { method: 'POST' }); loadJobs(); };
let prevActive = '';
async function loadJobs() {
  let d; try { d = await api('/api/jobs'); } catch { return; }
  state.jobs = d.jobs;
  const active = d.jobs.filter(j => j.status === 'pending' || j.status === 'running');
  $('#queueBtn').textContent = active.length ? `Queue (${active.length})` : 'Queue';
  $('#qEta').textContent = d.gpu_seconds_left ? `~${fmt(d.gpu_seconds_left)} of processing left` : '';
  const recTitle = id => { const r = state.recs.find(x => x.id === id); return r ? (r.title || `${whenOf(r).day} ${whenOf(r).time}`) : id; };
  $('#qList').innerHTML = d.jobs.slice().reverse().map(j => `<div class="job ${j.status}">
    <div class="jt"><span class="k">${KIND[j.kind] || j.kind}</span><span class="r">${esc(j.recs.map(recTitle).join(', '))}</span>
      <span class="st ${j.status}">${j.status}${j.status === 'running' && j.elapsed != null ? ' ' + fmt(j.elapsed) : ''}${j.status === 'pending' && j.estimate ? ' ~' + fmt(j.estimate) : ''}</span>
      ${j.status === 'pending' ? `<button class="link" data-up="${j.id}" title="Earlier">↑</button><button class="link" data-down="${j.id}" title="Later">↓</button>` : ''}
      ${j.status === 'pending' || j.status === 'running' ? `<button class="link" data-cancel="${j.id}">Cancel</button>` : ''}</div>
    ${j.progress || j.error ? `<div class="p">${esc(j.error || j.progress)}</div>` : ''}</div>`).join('') || '<div class="empty">Nothing queued.</div>';
  // USB sync needs the user to plug in / unplug: surface it prominently.
  const usb = d.jobs.find(j => j.kind === 'sync_usb' && j.status === 'running');
  const msg = usb && /Plug the Pocket|Unplug the cable/.test(usb.progress) ? usb.progress : '';
  $('#banner').textContent = msg; $('#banner').classList.toggle('show', !!msg);
  const sig = active.map(j => j.id + j.status).join();
  if (sig !== prevActive) {  // something finished or started: refresh list and detail
    prevActive = sig; await loadList();
    if (state.active && state.detail) openRec(state.active);
  }
}
$('#qList').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.cancel) await api(`/api/jobs/${b.dataset.cancel}/cancel`, { method: 'POST' });
  if (b.dataset.up) await api(`/api/jobs/${b.dataset.up}/move`, { method: 'POST', body: { direction: 'up' } });
  if (b.dataset.down) await api(`/api/jobs/${b.dataset.down}/move`, { method: 'POST', body: { direction: 'down' } });
  loadJobs();
});
$('#quitBtn').onclick = async () => {
  const busy = state.jobs.filter(j => j.status === 'pending' || j.status === 'running').length;
  if (!confirm(busy ? `Quit Pocket Recordings? ${busy} queued job(s) will pick up again the next time you open it.`
                    : 'Quit Pocket Recordings?')) return;
  audio.pause();
  try { await api('/api/shutdown', { method: 'POST' }); } catch {}
  document.body.innerHTML = '<div class="empty" style="padding-top:80px">Pocket Recordings has quit. Open it again from Launchpad or Spotlight.</div>';
};
async function loadVoices() { try { state.voices = (await api('/api/voices')).voices; } catch {} }

(async () => {
  await Promise.all([loadVoices(), loadModels(), loadJobs()]);
  await loadList();
  setInterval(loadJobs, 2000);
})();
</script>
</body>
</html>
